<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Autorizados e Eventos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 p-4 md:p-8 text-slate-200 relative min-h-screen">
    <div class="max-w-7xl mx-auto bg-slate-800 p-4 md:p-6 rounded-xl shadow-2xl border border-slate-700">
        
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
            <h1 class="text-2xl md:text-3xl font-bold text-blue-400 text-center md:text-left tracking-wide">
                Controle de Autorizações & Eventos
            </h1>
            <!-- Botão de Login do Administrador -->
            <button id="btn-admin-toggle" onclick="toggleAdmin()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 border border-slate-600 px-4 py-2 rounded text-xs font-semibold uppercase tracking-wider transition-colors">
                🔓 Modo Admin: Desativado
            </button>
        </div>

        <!-- Seletor de Abas (Autorizados / Eventos) -->
        <div class="flex border-b border-slate-700 mb-6">
            <button onclick="mudarAba('autorizados')" id="tab-autorizados" class="px-6 py-3 font-semibold text-blue-400 border-b-2 border-blue-500 transition-colors">Autorizados</button>
            <button onclick="mudarAba('eventos')" id="tab-eventos" class="px-6 py-3 font-semibold text-slate-400 hover:text-slate-200 transition-colors">Eventos</button>
        </div>

        <!-- ABACEL: AUTORIZADOS -->
        <div id="secao-autorizados" class="space-y-6">
            <div id="painel-admin-botoes-aut" class="flex flex-wrap items-center justify-center md:justify-start gap-3 w-full hidden">
                <input type="file" id="planilha" accept=".xlsx" class="hidden">
                <button onclick="document.getElementById('planilha').click()" class="bg-blue-600 text-white px-5 py-3 rounded hover:bg-blue-500 transition-colors font-medium text-sm flex-1 md:flex-none shadow-lg shadow-blue-900/50">
                    Importar Planilha
                </button>
                <button onclick="abrirModalManualAut()" class="bg-emerald-600 text-white px-5 py-3 rounded hover:bg-emerald-500 transition-colors font-medium text-sm flex-1 md:flex-none shadow-lg shadow-emerald-900/50">
                    + Cadastro Autorizado
                </button>
            </div>
            <hr id="divisor-admin-aut" class="border-slate-700 hidden">

            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <button onclick="verTodosAutorizados()" class="bg-purple-600 text-white px-5 py-3 rounded hover:bg-purple-500 transition-colors font-medium text-sm w-full md:w-auto shadow-lg shadow-purple-900/50">
                    Ver Todos os Autorizados
                </button>
            </div>

            <div class="w-full flex flex-col md:flex-row gap-3">
                <div class="w-full relative">
                    <input type="text" id="campo-pesquisa-aut" autocomplete="off" placeholder="Pesquisar nome ou empresa..." class="bg-slate-800 border border-slate-600 text-slate-200 placeholder-slate-400 p-3 rounded w-full text-base md:text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors">
                    <ul id="lista-sugestoes-aut" class="absolute z-10 w-full bg-slate-800 border border-slate-600 rounded-b mt-1 hidden max-h-60 overflow-y-auto shadow-xl"></ul>
                </div>
                <button onclick="pesquisarBtnAut()" class="bg-blue-600 text-white px-6 py-3 rounded hover:bg-blue-500 transition-colors font-bold text-base md:text-sm shadow-lg shadow-blue-900/50 w-full md:w-auto shrink-0">
                    Buscar
                </button>
            </div>
        </div>

        <!-- ABA: EVENTOS -->
        <div id="secao-eventos" class="space-y-6 hidden">
            <div id="painel-admin-botoes-evt" class="flex flex-wrap items-center justify-center md:justify-start gap-3 w-full hidden">
                <button onclick="abrirModalManualEvt()" class="bg-emerald-600 text-white px-5 py-3 rounded hover:bg-emerald-500 transition-colors font-medium text-sm flex-1 md:flex-none shadow-lg shadow-emerald-900/50">
                    + Cadastro Evento
                </button>
            </div>
            <hr id="divisor-admin-evt" class="border-slate-700 hidden">

            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <button onclick="verTodosEventos()" class="bg-purple-600 text-white px-5 py-3 rounded hover:bg-purple-500 transition-colors font-medium text-sm w-full md:w-auto shadow-lg shadow-purple-900/50">
                    Ver Todos os Eventos
                </button>
            </div>

            <div class="w-full flex flex-col md:flex-row gap-3">
                <div class="w-full relative">
                    <input type="text" id="campo-pesquisa-evt" autocomplete="off" placeholder="Pesquisar nome do evento ou local..." class="bg-slate-800 border border-slate-600 text-slate-200 placeholder-slate-400 p-3 rounded w-full text-base md:text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors">
                    <ul id="lista-sugestoes-evt" class="absolute z-10 w-full bg-slate-800 border border-slate-600 rounded-b mt-1 hidden max-h-60 overflow-y-auto shadow-xl"></ul>
                </div>
                <button onclick="pesquisarBtnEvt()" class="bg-blue-600 text-white px-6 py-3 rounded hover:bg-blue-500 transition-colors font-bold text-base md:text-sm shadow-lg shadow-blue-900/50 w-full md:w-auto shrink-0">
                    Buscar
                </button>
            </div>
        </div>

    </div>

    <!-- Modal Pop-up: Tabela de Resultados -->
    <div id="modal-tabela" class="fixed inset-0 bg-black/80 hidden flex justify-center items-center z-40 backdrop-blur-sm p-2 md:p-4">
        <div class="bg-slate-800 border border-slate-600 p-4 md:p-6 rounded-xl shadow-2xl w-full max-w-7xl max-h-[95vh] flex flex-col">
            
            <div class="flex flex-col md:flex-row justify-between items-center mb-4 gap-4">
                <h2 id="titulo-modal-tabela" class="text-xl md:text-2xl font-bold text-slate-100">Resultados</h2>
                
                <div class="flex flex-col sm:flex-row gap-2 w-full md:w-auto" id="container-filtro-coluna">
                    <select id="filtro-coluna" class="bg-slate-700 border border-slate-600 text-slate-200 p-2.5 rounded text-sm focus:outline-none focus:border-blue-500">
                        <option value="todos">Filtrar por Coluna...</option>
                    </select>
                    <input type="text" id="filtro-valor" placeholder="Digite para filtrar..." class="bg-slate-700 border border-slate-600 text-slate-200 placeholder-slate-400 p-2.5 rounded text-sm focus:outline-none focus:border-blue-500 w-full sm:w-60" oninput="aplicarFiltroColuna()">
                </div>

                <button onclick="fecharModalTabela()" class="text-slate-400 hover:text-red-400 transition-colors font-bold text-3xl leading-none">&times;</button>
            </div>
            
            <div class="overflow-x-auto overflow-y-auto border border-slate-700 rounded-lg bg-slate-900 shadow-inner flex-1">
                <table class="w-full text-center border-collapse min-w-[900px]">
                    <thead class="sticky top-0 bg-slate-700 shadow-md">
                        <tr id="tabela-cabecalho" class="text-sm uppercase text-slate-300 font-semibold tracking-wider">
                            <!-- Inserido dinamicamente via JS -->
                        </tr>
                    </thead>
                    <tbody id="tabela-corpo" class="text-sm divide-y divide-slate-700">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Pop-up: Cadastro/Edição Autorizado -->
    <div id="modal-manual-aut" class="fixed inset-0 bg-black/80 hidden flex justify-center items-center z-50 backdrop-blur-sm p-2">
        <div class="bg-slate-800 border border-slate-600 p-6 rounded-xl shadow-2xl w-full max-w-md max-h-[95vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 id="titulo-modal-manual-aut" class="text-2xl font-bold text-slate-100">Novo Autorizado</h2>
                <button onclick="fecharModalManualAut()" class="text-slate-400 hover:text-red-400 transition-colors font-bold text-3xl leading-none">&times;</button>
            </div>
            <form id="form-manual-aut" class="flex flex-col gap-4 text-left">
                <input type="hidden" id="cad-id-aut">
                <div class="flex gap-4">
                    <div class="w-1/2">
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">DATA DA MENSAGEM</label>
                        <input type="text" id="cad-data-mensagem-aut" inputmode="numeric" maxlength="10" placeholder="DD/MM/AAAA" class="bg-slate-700 border border-slate-600 text-slate-200 p-2.5 rounded w-full focus:outline-none focus:border-blue-500" required>
                    </div>
                    <div class="w-1/2">
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">FORMATO ENVIO</label>
                        <select id="cad-formato-aut" class="bg-slate-700 border border-slate-600 text-slate-200 p-2.5 rounded w-full focus:outline-none focus:border-blue-500">
                            <option value="Mensagem">Mensagem</option>
                            <option value="PDF">PDF</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">NOME</label>
                    <input type="text" id="cad-nome-aut" placeholder="Nome completo" class="bg-slate-700 border border-slate-600 text-slate-200 p-2.5 rounded w-full focus:outline-none focus:border-blue-500" required>
                </div>
                <div class="flex gap-4">
                    <div class="w-1/2">
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">INÍCIO</label>
                        <input type="text" id="cad-inicio-aut" inputmode="numeric" maxlength="10" placeholder="DD/MM/AAAA" class="bg-slate-700 border border-slate-600 text-slate-200 p-2.5 rounded w-full focus:outline-none focus:border-blue-500">
                    </div>
                    <div class="w-1/2">
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">FIM</label>
                        <input type="text" id="cad-fim-aut" inputmode="numeric" maxlength="10" placeholder="DD/MM/AAAA" class="bg-slate-700 border border-slate-600 text-slate-200 p-2.5 rounded w-full focus:outline-none focus:border-blue-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">EMPRESA</label>
                    <input type="text" id="cad-empresa-aut" placeholder="Nome da Empresa" class="bg-slate-700 border border-slate-600 text-slate-200 p-2.5 rounded w-full focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">LOCAL</label>
                    <input type="text" id="cad-local-aut" placeholder="Local de autorização" class="bg-slate-700 border border-slate-600 text-slate-200 p-2.5 rounded w-full focus:outline-none focus:border-blue-500">
                </div>
                <div class="flex justify-end gap-3 mt-4">
                    <button type="button" onclick="fecharModalManualAut()" class="px-5 py-3 bg-slate-700 border border-slate-600 text-slate-300 rounded hover:bg-slate-600 transition-colors font-medium">Cancelar</button>
                    <button type="submit" class="px-5 py-3 bg-emerald-600 text-white rounded hover:bg-emerald-500 transition-colors font-medium shadow-lg shadow-emerald-900/50">Salvar Registro</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Pop-up: Cadastro/Edição Evento -->
    <div id="modal-manual-evt" class="fixed inset-0 bg-black/80 hidden flex justify-center items-center z-50 backdrop-blur-sm p-2">
        <div class="bg-slate-800 border border-slate-600 p-6 rounded-xl shadow-2xl w-full max-w-md max-h-[95vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 id="titulo-modal-manual-evt" class="text-2xl font-bold text-slate-100">Novo Evento</h2>
                <button onclick="fecharModalManualEvt()" class="text-slate-400 hover:text-red-400 transition-colors font-bold text-3xl leading-none">&times;</button>
            </div>
            <form id="form-manual-evt" class="flex flex-col gap-4 text-left">
                <input type="hidden" id="cad-id-evt">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">DATA DA MENSAGEM</label>
                    <input type="text" id="cad-data-mensagem-evt" inputmode="numeric" maxlength="10" placeholder="DD/MM/AAAA" class="bg-slate-700 border border-slate-600 text-slate-200 p-2.5 rounded w-full focus:outline-none focus:border-blue-500" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">NOME DO EVENTO</label>
                    <input type="text" id="cad-nome-evt" placeholder="Nome do evento" class="bg-slate-700 border border-slate-600 text-slate-200 p-2.5 rounded w-full focus:outline-none focus:border-blue-500" required>
                </div>
                <div class="flex gap-4">
                    <div class="w-1/2">
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">INÍCIO</label>
                        <input type="text" id="cad-inicio-evt" inputmode="numeric" maxlength="10" placeholder="DD/MM/AAAA" class="bg-slate-700 border border-slate-600 text-slate-200 p-2.5 rounded w-full focus:outline-none focus:border-blue-500" required>
                    </div>
                    <div class="w-1/2">
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">FIM</label>
                        <input type="text" id="cad-fim-evt" inputmode="numeric" maxlength="10" placeholder="DD/MM/AAAA" class="bg-slate-700 border border-slate-600 text-slate-200 p-2.5 rounded w-full focus:outline-none focus:border-blue-500" required>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">LOCAL</label>
                    <input type="text" id="cad-local-evt" placeholder="Local do evento" class="bg-slate-700 border border-slate-600 text-slate-200 p-2.5 rounded w-full focus:outline-none focus:border-blue-500" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">HORÁRIO</label>
                    <input type="text" id="cad-horario-evt" placeholder="Ex: 19:30" class="bg-slate-700 border border-slate-600 text-slate-200 p-2.5 rounded w-full focus:outline-none focus:border-blue-500" required>
                </div>
                <div class="flex justify-end gap-3 mt-4">
                    <button type="button" onclick="fecharModalManualEvt()" class="px-5 py-3 bg-slate-700 border border-slate-600 text-slate-300 rounded hover:bg-slate-600 transition-colors font-medium">Cancelar</button>
                    <button type="submit" class="px-5 py-3 bg-emerald-600 text-white rounded hover:bg-emerald-500 transition-colors font-medium shadow-lg shadow-emerald-900/50">Salvar Evento</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let todosAutorizados = [];
        let todosEventos = [];
        let registrosAtuaisNaTabela = [];
        let abaAtiva = 'autorizados';
        let isAdmin = localStorage.getItem('isAdmin') === 'true';

        const modalManualAut = document.getElementById('modal-manual-aut');
        const modalManualEvt = document.getElementById('modal-manual-evt');
        const modalTabela = document.getElementById('modal-tabela');
        
        const campoPesquisaAut = document.getElementById('campo-pesquisa-aut');
        const campoPesquisaEvt = document.getElementById('campo-pesquisa-evt');
        const listaSugestoesAut = document.getElementById('lista-sugestoes-aut');
        const listaSugestoesEvt = document.getElementById('lista-sugestoes-evt');

        atualizarEstadoAdminUI();

        function mudarAba(aba) {
            abaAtiva = aba;
            const tabAut = document.getElementById('tab-autorizados');
            const tabEvt = document.getElementById('tab-eventos');
            const secAut = document.getElementById('secao-autorizados');
            const secEvt = document.getElementById('secao-eventos');

            if (aba === 'autorizados') {
                tabAut.className = "px-6 py-3 font-semibold text-blue-400 border-b-2 border-blue-500 transition-colors";
                tabEvt.className = "px-6 py-3 font-semibold text-slate-400 hover:text-slate-200 transition-colors";
                secAut.classList.remove('hidden');
                secEvt.classList.add('hidden');
            } else {
                tabEvt.className = "px-6 py-3 font-semibold text-blue-400 border-b-2 border-blue-500 transition-colors";
                tabAut.className = "px-6 py-3 font-semibold text-slate-400 hover:text-slate-200 transition-colors";
                secEvt.classList.remove('hidden');
                secAut.classList.add('hidden');
            }
        }

        function atualizarEstadoAdminUI() {
            const btnToggle = document.getElementById('btn-admin-toggle');
            const painelAut = document.getElementById('painel-admin-botoes-aut');
            const divAut = document.getElementById('divisor-admin-aut');
            const painelEvt = document.getElementById('painel-admin-botoes-evt');
            const divEvt = document.getElementById('divisor-admin-evt');

            if (isAdmin) {
                btnToggle.innerText = "🔒 Modo Admin: Ativo";
                btnToggle.className = "bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 px-4 py-2 rounded text-xs font-semibold uppercase tracking-wider transition-colors";
                painelAut.classList.remove('hidden');
                divAut.classList.remove('hidden');
                painelEvt.classList.remove('hidden');
                divEvt.classList.remove('hidden');
            } else {
                btnToggle.innerText = "🔓 Modo Admin: Desativado";
                btnToggle.className = "bg-slate-700 hover:bg-slate-600 text-slate-300 border border-slate-600 px-4 py-2 rounded text-xs font-semibold uppercase tracking-wider transition-colors";
                painelAut.classList.add('hidden');
                divAut.classList.add('hidden');
                painelEvt.classList.add('hidden');
                divEvt.classList.add('hidden');
            }
        }

        function toggleAdmin() {
            if (isAdmin) {
                isAdmin = false;
                localStorage.setItem('isAdmin', 'false');
                atualizarEstadoAdminUI();
                alert("Modo Admin desativado.");
                atualizarTabelaAberta();
            } else {
                const senha = prompt("Digite a senha de Administrador:");
                if (senha === null) return;
                
                fetch('/verificar-admin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ senha })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.sucesso) {
                        isAdmin = true;
                        localStorage.setItem('isAdmin', 'true');
                        atualizarEstadoAdminUI();
                        alert("Modo Admin ativado com sucesso!");
                        atualizarTabelaAberta();
                    } else {
                        alert("Senha incorreta!");
                    }
                })
                .catch(() => alert("Erro ao verificar senha."));
            }
        }

        function tentarAcaoAdmin(acaoCallback) {
            if (!isAdmin) {
                alert("Somente administrador");
                return;
            }
            acaoCallback();
        }

        function aplicarMascaraData(e) {
            let valor = e.target.value.replace(/\D/g, "");
            if (valor.length > 8) valor = valor.slice(0, 8);
            if (valor.length > 4) {
                valor = valor.replace(/^(\d{2})(\d{2})(\d{0,4})/, "$1/$2/$3");
            } else if (valor.length > 2) {
                valor = valor.replace(/^(\d{2})(\d{0,2})/, "$1/$2");
            }
            e.target.value = valor;
        }

        ['cad-data-mensagem-aut', 'cad-inicio-aut', 'cad-fim-aut', 'cad-data-mensagem-evt', 'cad-inicio-evt', 'cad-fim-evt'].forEach(id => {
            document.getElementById(id).addEventListener('input', aplicarMascaraData);
        });
        
        function abrirModalManualAut() { 
            tentarAcaoAdmin(() => {
                document.getElementById('form-manual-aut').reset();
                document.getElementById('cad-id-aut').value = '';
                document.getElementById('titulo-modal-manual-aut').innerText = "Novo Autorizado";
                modalManualAut.classList.remove('hidden'); 
            });
        }
        function fecharModalManualAut() { modalManualAut.classList.add('hidden'); document.getElementById('form-manual-aut').reset(); }

        function abrirModalManualEvt() { 
            tentarAcaoAdmin(() => {
                document.getElementById('form-manual-evt').reset();
                document.getElementById('cad-id-evt').value = '';
                document.getElementById('titulo-modal-manual-evt').innerText = "Novo Evento";
                modalManualEvt.classList.remove('hidden'); 
            });
        }
        function fecharModalManualEvt() { modalManualEvt.classList.add('hidden'); document.getElementById('form-manual-evt').reset(); }
        
        function fecharModalTabela() { 
            modalTabela.classList.add('hidden'); 
            campoPesquisaAut.value = ''; 
            campoPesquisaEvt.value = '';
            document.getElementById('filtro-coluna').value = 'todos';
            document.getElementById('filtro-valor').value = '';
        }

        function removerAcentos(str) {
            return str ? str.normalize("NFD").replace(/[\u0300-\u036f]/g, "") : "";
        }

        function isValido(dataStr, fimStr) {
            const dataBase = fimStr || dataStr;
            if (!dataBase) return false;
            const partes = String(dataBase).replace(/-/g, '/').split('/');
            if (partes.length < 3) return false;
            let [dia, mes, ano] = partes;
            if (ano.length === 2) ano = `20${ano}`;
            const dataLimite = new Date(`${ano}-${mes}-${dia}T23:59:59`);
            return dataLimite >= new Date();
        }

        // --- CRUD AUTORIZADOS ---
        function editarAutorizado(id) {
            tentarAcaoAdmin(() => {
                const reg = todosAutorizados.find(r => r.id == id);
                if (!reg) return;
                document.getElementById('cad-id-aut').value = reg.id;
                document.getElementById('cad-data-mensagem-aut').value = reg.data_mensagem || '';
                document.getElementById('cad-formato-aut').value = reg.formato_envio || 'Mensagem';
                document.getElementById('cad-nome-aut').value = reg.nome || '';
                document.getElementById('cad-inicio-aut').value = reg.inicio_autorizacao || '';
                document.getElementById('cad-fim-aut').value = reg.fim_autorizacao || '';
                document.getElementById('cad-empresa-aut').value = reg.empresa || '';
                document.getElementById('cad-local-aut').value = reg.local_autorizacao || '';
                document.getElementById('titulo-modal-manual-aut').innerText = "Editar Autorizado";
                modalManualAut.classList.remove('hidden');
            });
        }

        async function excluirAutorizado(id, nome) {
            tentarAcaoAdmin(async () => {
                if (!confirm(`Deseja excluir o autorizado:\n${nome}?`)) return;
                try {
                    const res = await fetch(`/autorizacoes/${id}`, { method: 'DELETE' });
                    const data = await res.json();
                    alert(data.mensagem || data.erro);
                    await carregarDados();
                    atualizarTabelaAberta();
                } catch (err) { alert('Erro ao excluir.'); }
            });
        }

        // --- CRUD EVENTOS ---
        function editarEvento(id) {
            tentarAcaoAdmin(() => {
                const ev = todosEventos.find(e => e.id == id);
                if (!ev) return;
                document.getElementById('cad-id-evt').value = ev.id;
                document.getElementById('cad-data-mensagem-evt').value = ev.data_mensagem || '';
                document.getElementById('cad-nome-evt').value = ev.nome_evento || '';
                document.getElementById('cad-inicio-evt').value = ev.inicio_evento || '';
                document.getElementById('cad-fim-evt').value = ev.fim_evento || '';
                document.getElementById('cad-local-evt').value = ev.local_evento || '';
                document.getElementById('cad-horario-evt').value = ev.horario || '';
                document.getElementById('titulo-modal-manual-evt').innerText = "Editar Evento";
                modalManualEvt.classList.remove('hidden');
            });
        }

        async function excluirEvento(id, nome) {
            tentarAcaoAdmin(async () => {
                if (!confirm(`Deseja excluir o evento:\n${nome}?`)) return;
                try {
                    const res = await fetch(`/eventos/${id}`, { method: 'DELETE' });
                    const data = await res.json();
                    alert(data.mensagem || data.erro);
                    await carregarDados();
                    atualizarTabelaAberta();
                } catch (err) { alert('Erro ao excluir.'); }
            });
        }

        // Submits
        document.getElementById('form-manual-aut').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!isAdmin) { alert("Somente administrador"); return; }
            const id = document.getElementById('cad-id-aut').value;
            const payload = {
                data_mensagem: document.getElementById('cad-data-mensagem-aut').value,
                formato_envio: document.getElementById('cad-formato-aut').value,
                nome: document.getElementById('cad-nome-aut').value,
                inicio_autorizacao: document.getElementById('cad-inicio-aut').value,
                fim_autorizacao: document.getElementById('cad-fim-aut').value,
                empresa: document.getElementById('cad-empresa-aut').value,
                local_autorizacao: document.getElementById('cad-local-aut').value
            };
            const url = id ? `/autorizacoes/${id}` : '/autorizacoes';
            const method = id ? 'PUT' : 'POST';
            try {
                const res = await fetch(url, { method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
                const data = await res.json();
                alert(data.mensagem || data.erro);
                fecharModalManualAut();
                await carregarDados();
                atualizarTabelaAberta();
            } catch (err) { alert('Erro ao salvar.'); }
        });

        document.getElementById('form-manual-evt').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!isAdmin) { alert("Somente administrador"); return; }
            const id = document.getElementById('cad-id-evt').value;
            const payload = {
                data_mensagem: document.getElementById('cad-data-mensagem-evt').value,
                nome_evento: document.getElementById('cad-nome-evt').value,
                inicio_evento: document.getElementById('cad-inicio-evt').value,
                fim_evento: document.getElementById('cad-fim-evt').value,
                local_evento: document.getElementById('cad-local-evt').value,
                horario: document.getElementById('cad-horario-evt').value
            };
            const url = id ? `/eventos/${id}` : '/eventos';
            const method = id ? 'PUT' : 'POST';
            try {
                const res = await fetch(url, { method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
                const data = await res.json();
                alert(data.mensagem || data.erro);
                fecharModalManualEvt();
                await carregarDados();
                atualizarTabelaAberta();
            } catch (err) { alert('Erro ao salvar.'); }
        });

        document.getElementById('planilha').addEventListener('change', async (e) => {
            if (!isAdmin) { alert("Somente administrador"); e.target.value = ''; return; }
            const arquivo = e.target.files[0];
            if (!arquivo) return;
            const formData = new FormData();
            formData.append('planilha', arquivo);
            try {
                const res = await fetch('/importar', { method: 'POST', body: formData });
                const data = await res.json();
                alert(data.mensagem || data.erro);
                await carregarDados();
                atualizarTabelaAberta();
            } catch (err) { alert('Erro ao comunicar com o servidor.'); }
            e.target.value = '';
        });

        function atualizarTabelaAberta() {
            if (!modalTabela.classList.contains('hidden')) {
                if (abaAtiva === 'autorizados') {
                    if (campoPesquisaAut.value.trim() !== '') pesquisarAut();
                    else verTodosAutorizados();
                } else {
                    if (campoPesquisaEvt.value.trim() !== '') pesquisarEvt();
                    else verTodosEventos();
                }
            }
        }

        // Autocompletar Autorizados
        campoPesquisaAut.addEventListener('input', (e) => {
            const termo = removerAcentos(e.target.value.trim().toLowerCase());
            if (!termo) { listaSugestoesAut.classList.add('hidden'); return; }
            const sugestoes = [...new Set(todosAutorizados.filter(i => i.nome && removerAcentos(i.nome.toLowerCase()).includes(termo)).map(i => i.nome))].slice(0, 6);
            if (sugestoes.length === 0) { listaSugestoesAut.classList.add('hidden'); return; }
            listaSugestoesAut.innerHTML = '';
            sugestoes.forEach(nome => {
                const li = document.createElement('li');
                li.className = 'p-3 hover:bg-slate-700 cursor-pointer text-slate-200 border-b border-slate-700 text-sm';
                li.innerText = nome;
                li.onmousedown = () => { campoPesquisaAut.value = nome; listaSugestoesAut.classList.add('hidden'); pesquisarBtnAut(); };
                listaSugestoesAut.appendChild(li);
            });
            listaSugestoesAut.classList.remove('hidden');
        });

        // Autocompletar Eventos
        campoPesquisaEvt.addEventListener('input', (e) => {
            const termo = removerAcentos(e.target.value.trim().toLowerCase());
            if (!termo) { listaSugestoesEvt.classList.add('hidden'); return; }
            const sugestoes = [...new Set(todosEventos.filter(i => i.nome_evento && removerAcentos(i.nome_evento.toLowerCase()).includes(termo)).map(i => i.nome_evento))].slice(0, 6);
            if (sugestoes.length === 0) { listaSugestoesEvt.classList.add('hidden'); return; }
            listaSugestoesEvt.innerHTML = '';
            sugestoes.forEach(nome => {
                const li = document.createElement('li');
                li.className = 'p-3 hover:bg-slate-700 cursor-pointer text-slate-200 border-b border-slate-700 text-sm';
                li.innerText = nome;
                li.onmousedown = () => { campoPesquisaEvt.value = nome; listaSugestoesEvt.classList.add('hidden'); pesquisarBtnEvt(); };
                listaSugestoesEvt.appendChild(li);
            });
            listaSugestoesEvt.classList.remove('hidden');
        });

        function pesquisarBtnAut() { if (!campoPesquisaAut.value.trim()) { alert("Digite algo."); return; } pesquisarAut(); }
        function pesquisarBtnEvt() { if (!campoPesquisaEvt.value.trim()) { alert("Digite algo."); return; } pesquisarEvt(); }

        function pesquisarAut() {
            const val = campoPesquisaAut.value.trim();
            const termo = removerAcentos(val.toLowerCase());
            const filtrados = todosAutorizados.filter(i => (i.nome && removerAcentos(i.nome.toLowerCase()).includes(termo)) || (i.empresa && removerAcentos(i.empresa.toLowerCase()).includes(termo)));
            document.getElementById('titulo-modal-tabela').innerText = `Resultados para: "${val}"`;
            configurarFiltroColuna('autorizados');
            registrosAtuaisNaTabela = filtrados;
            renderizarTabela(filtrados, 'autorizados');
            modalTabela.classList.remove('hidden');
        }

        function pesquisarEvt() {
            const val = campoPesquisaEvt.value.trim();
            const termo = removerAcentos(val.toLowerCase());
            const filtrados = todosEventos.filter(e => (e.nome_evento && removerAcentos(e.nome_evento.toLowerCase()).includes(termo)) || (e.local_evento && removerAcentos(e.local_evento.toLowerCase()).includes(termo)));
            document.getElementById('titulo-modal-tabela').innerText = `Eventos para: "${val}"`;
            configurarFiltroColuna('eventos');
            registrosAtuaisNaTabela = filtrados;
            renderizarTabela(filtrados, 'eventos');
            modalTabela.classList.remove('hidden');
        }

        function verTodosAutorizados() {
            document.getElementById('titulo-modal-tabela').innerText = "Todos os Autorizados";
            configurarFiltroColuna('autorizados');
            registrosAtuaisNaTabela = todosAutorizados;
            renderizarTabela(todosAutorizados, 'autorizados');
            modalTabela.classList.remove('hidden');
        }

        function verTodosEventos() {
            document.getElementById('titulo-modal-tabela').innerText = "Todos os Eventos";
            configurarFiltroColuna('eventos');
            registrosAtuaisNaTabela = todosEventos;
            renderizarTabela(todosEventos, 'eventos');
            modalTabela.classList.remove('hidden');
        }

        function configurarFiltroColuna(tipo) {
            const select = document.getElementById('filtro-coluna');
            select.innerHTML = '<option value="todos">Filtrar por Coluna...</option>';
            if (tipo === 'autorizados') {
                select.innerHTML += `
                    <option value="status">Status</option>
                    <option value="data_mensagem">Data Mensagem</option>
                    <option value="nome">Nome</option>
                    <option value="inicio_autorizacao">Início</option>
                    <option value="fim_autorizacao">Fim</option>
                    <option value="empresa">Empresa</option>
                    <option value="local_autorizacao">Local</option>
                    <option value="formato_envio">Formato</option>
                `;
            } else {
                select.innerHTML += `
                    <option value="status">Status</option>
                    <option value="data_mensagem">Data Mensagem</option>
                    <option value="nome_evento">Evento</option>
                    <option value="inicio_evento">Início</option>
                    <option value="fim_evento">Fim</option>
                    <option value="local_evento">Local</option>
                    <option value="horario">Horário</option>
                `;
            }
        }

        function aplicarFiltroColuna() {
            const coluna = document.getElementById('filtro-coluna').value;
            const valorFiltro = removerAcentos(document.getElementById('filtro-valor').value.trim().toLowerCase());
            if (coluna === 'todos' || !valorFiltro) {
                renderizarTabela(registrosAtuaisNaTabela, abaAtiva);
                return;
            }
            const filtrados = registrosAtuaisNaTabela.filter(item => {
                if (coluna === 'status') {
                    const ativo = abaAtiva === 'autorizados' ? isValido(item.data_mensagem, item.fim_autorizacao) : isValido(item.data_mensagem, item.fim_evento);
                    return (ativo ? 'valido' : 'vencido').includes(valorFiltro);
                }
                const v = item[coluna] ? String(item[coluna]) : '';
                return removerAcentos(v.toLowerCase()).includes(valorFiltro);
            });
            renderizarTabela(filtrados, abaAtiva);
        }

        async function carregarDados() {
            try {
                const resA = await fetch('/autorizacoes');
                todosAutorizados = await resA.json();
                const resE = await fetch('/eventos');
                todosEventos = await resE.json();
            } catch (err) { console.error('Erro:', err); }
        }

        function renderizarTabela(dados, tipo) {
            const thead = document.getElementById('tabela-cabecalho');
            const tbody = document.getElementById('tabela-corpo');
            tbody.innerHTML = '';

            let acoesTh = isAdmin ? `<th class="p-4 border-b border-slate-600 whitespace-nowrap text-center">Ações</th>` : '';

            if (tipo === 'autorizados') {
                thead.innerHTML = `
                    <th class="p-4 border-b border-slate-600">Status</th>
                    <th class="p-4 border-b border-slate-600 whitespace-nowrap">Data Mens.</th>
                    <th class="p-4 border-b border-slate-600 text-left">Nome</th>
                    <th class="p-4 border-b border-slate-600 whitespace-nowrap">Início</th>
                    <th class="p-4 border-b border-slate-600 whitespace-nowrap">Fim</th>
                    <th class="p-4 border-b border-slate-600 text-left">Empresa</th>
                    <th class="p-4 border-b border-slate-600 text-left">Local</th>
                    <th class="p-4 border-b border-slate-600 whitespace-nowrap">Formato</th>
                    ${acoesTh}
                `;
            } else {
                thead.innerHTML = `
                    <th class="p-4 border-b border-slate-600">Status</th>
                    <th class="p-4 border-b border-slate-600 whitespace-nowrap">Data Mens.</th>
                    <th class="p-4 border-b border-slate-600 text-left">Evento</th>
                    <th class="p-4 border-b border-slate-600 whitespace-nowrap">Início</th>
                    <th class="p-4 border-b border-slate-600 whitespace-nowrap">Fim</th>
                    <th class="p-4 border-b border-slate-600 text-left">Local</th>
                    <th class="p-4 border-b border-slate-600 whitespace-nowrap">Horário</th>
                    ${acoesTh}
                `;
            }

            if (dados.length === 0) {
                const cols = isAdmin ? (tipo === 'autorizados' ? 9 : 8) : (tipo === 'autorizados' ? 8 : 7);
                tbody.innerHTML = `<tr><td colspan="${cols}" class="p-6 text-slate-400">Nenhum registro encontrado.</td></tr>`;
                return;
            }

            dados.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-700/50 transition-colors';
                
                if (tipo === 'autorizados') {
                    const ativo = isValido(item.data_mensagem, item.fim_autorizacao);
                    const badge = ativo ? `<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1 rounded-full text-xs font-bold">Válido</span>` : `<span class="bg-red-500/10 text-red-400 border border-red-500/20 px-3 py-1 rounded-full text-xs font-bold">Vencido</span>`;
                    
                    let acoesTd = isAdmin ? `
                        <td class="p-4 text-center flex justify-center gap-2 items-center">
                            <button onclick="editarAutorizado('${item.id}')" class="bg-blue-600/20 text-blue-400 hover:bg-blue-500 hover:text-white px-2 py-1 rounded text-xs font-bold uppercase">Editar</button>
                            <button onclick="excluirAutorizado('${item.id}', '${item.nome}')" class="bg-red-600/20 text-red-400 hover:bg-red-500 hover:text-white px-2 py-1 rounded text-xs font-bold uppercase">Excluir</button>
                        </td>` : '';

                    tr.innerHTML = `
                        <td class="p-4 align-middle">${badge}</td>
                        <td class="p-4 text-slate-300">${item.data_mensagem || '-'}</td>
                        <td class="p-4 font-medium text-left text-slate-100">${item.nome}</td>
                        <td class="p-4 text-slate-300">${item.inicio_autorizacao || '-'}</td>
                        <td class="p-4 text-slate-300">${item.fim_autorizacao || '-'}</td>
                        <td class="p-4 text-left text-slate-300">${item.empresa || '-'}</td>
                        <td class="p-4 text-left text-slate-300">${item.local_autorizacao || '-'}</td>
                        <td class="p-4 text-center"><span class="px-2 py-1 bg-slate-700 border border-slate-600 text-xs rounded-full text-slate-300">${item.formato_envio || '-'}</span></td>
                        ${acoesTd}
                    `;
                } else {
                    const ativo = isValido(item.data_mensagem, item.fim_evento);
                    const badge = ativo ? `<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1 rounded-full text-xs font-bold">Válido</span>` : `<span class="bg-red-500/10 text-red-400 border border-red-500/20 px-3 py-1 rounded-full text-xs font-bold">Vencido</span>`;
                    
                    let acoesTd = isAdmin ? `
                        <td class="p-4 text-center flex justify-center gap-2 items-center">
                            <button onclick="editarEvento('${item.id}')" class="bg-blue-600/20 text-blue-400 hover:bg-blue-500 hover:text-white px-2 py-1 rounded text-xs font-bold uppercase">Editar</button>
                            <button onclick="excluirEvento('${item.id}', '${item.nome_evento}')" class="bg-red-600/20 text-red-400 hover:bg-red-500 hover:text-white px-2 py-1 rounded text-xs font-bold uppercase">Excluir</button>
                        </td>` : '';

                    tr.innerHTML = `
                        <td class="p-4 align-middle">${badge}</td>
                        <td class="p-4 text-slate-300">${item.data_mensagem || '-'}</td>
                        <td class="p-4 font-medium text-left text-slate-100">${item.nome_evento}</td>
                        <td class="p-4 text-slate-300">${item.inicio_evento || '-'}</td>
                        <td class="p-4 text-slate-300">${item.fim_evento || '-'}</td>
                        <td class="p-4 text-left text-slate-300">${item.local_evento || '-'}</td>
                        <td class="p-4 text-slate-300">${item.horario || '-'}</td>
                        ${acoesTd}
                    `;
                }
                tbody.appendChild(tr);
            });
        }

        carregarDados();
    </script>
</body>
</html>
