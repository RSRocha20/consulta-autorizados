<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Autorizados</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 p-4 md:p-8 text-slate-200 relative min-h-screen">
    <div class="max-w-7xl mx-auto bg-slate-800 p-4 md:p-6 rounded-xl shadow-2xl border border-slate-700">
        
        <h1 class="text-2xl md:text-3xl font-bold mb-6 text-blue-400 text-center md:text-left tracking-wide">
            Sistema de Autorizações
        </h1>

        <!-- Barra de Controles Principal -->
        <div class="bg-slate-900/50 border border-slate-700 p-4 rounded-lg flex flex-col gap-6">
            
            <!-- Botões de Ação -->
            <div class="flex flex-wrap items-center justify-center md:justify-start gap-3 w-full">
                <input type="file" id="planilha" accept=".xlsx" class="hidden">
                <button onclick="document.getElementById('planilha').click()" class="bg-blue-600 text-white px-5 py-3 rounded hover:bg-blue-500 transition-colors font-medium text-sm flex-1 md:flex-none shadow-lg shadow-blue-900/50">
                    Importar Planilha
                </button>
                <button onclick="abrirModalManual()" class="bg-emerald-600 text-white px-5 py-3 rounded hover:bg-emerald-500 transition-colors font-medium text-sm flex-1 md:flex-none shadow-lg shadow-emerald-900/50">
                    + Cadastro
                </button>
                <button onclick="verTodos()" class="bg-purple-600 text-white px-5 py-3 rounded hover:bg-purple-500 transition-colors font-medium text-sm flex-1 md:flex-none shadow-lg shadow-purple-900/50">
                    Ver Todos
                </button>
            </div>

            <hr class="border-slate-700">

            <!-- Campo de Pesquisa com Autocompletar -->
            <div class="w-full flex flex-col md:flex-row gap-3">
                <div class="w-full relative">
                    <input type="text" id="campo-pesquisa" autocomplete="off" placeholder="Pesquisar nome ou empresa..." class="bg-slate-800 border border-slate-600 text-slate-200 placeholder-slate-400 p-3 rounded w-full text-base md:text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors">
                    <ul id="lista-sugestoes" class="absolute z-10 w-full bg-slate-800 border border-slate-600 rounded-b mt-1 hidden max-h-60 overflow-y-auto shadow-xl"></ul>
                </div>
                <button onclick="pesquisarBtn()" class="bg-blue-600 text-white px-6 py-3 rounded hover:bg-blue-500 transition-colors font-bold text-base md:text-sm shadow-lg shadow-blue-900/50 w-full md:w-auto shrink-0">
                    Buscar
                </button>
            </div>
            
        </div>
    </div>

    <!-- Modal Pop-up: Tabela de Resultados -->
    <div id="modal-tabela" class="fixed inset-0 bg-black/80 hidden flex justify-center items-center z-40 backdrop-blur-sm p-2 md:p-4">
        <div class="bg-slate-800 border border-slate-600 p-4 md:p-6 rounded-xl shadow-2xl w-full max-w-7xl max-h-[95vh] flex flex-col">
            
            <div class="flex justify-between items-center mb-4">
                <h2 id="titulo-modal-tabela" class="text-xl md:text-2xl font-bold text-slate-100">Resultados</h2>
                <button onclick="fecharModalTabela()" class="text-slate-400 hover:text-red-400 transition-colors font-bold text-3xl leading-none">&times;</button>
            </div>
            
            <div class="overflow-x-auto overflow-y-auto border border-slate-700 rounded-lg bg-slate-900 shadow-inner flex-1">
                <table class="w-full text-center border-collapse min-w-[900px]">
                    <thead class="sticky top-0 bg-slate-700 shadow-md">
                        <tr class="text-sm uppercase text-slate-300 font-semibold tracking-wider">
                            <th class="p-4 border-b border-slate-600">Status</th>
                            <th class="p-4 border-b border-slate-600 whitespace-nowrap">Data Mens.</th>
                            <th class="p-4 border-b border-slate-600 text-left">Nome</th>
                            <th class="p-4 border-b border-slate-600 whitespace-nowrap">Início</th>
                            <th class="p-4 border-b border-slate-600 whitespace-nowrap">Fim</th>
                            <th class="p-4 border-b border-slate-600 text-left">Empresa</th>
                            <th class="p-4 border-b border-slate-600 text-left">Local</th>
                            <th class="p-4 border-b border-slate-600 whitespace-nowrap">Formato</th>
                            <th class="p-4 border-b border-slate-600 whitespace-nowrap text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-corpo" class="text-sm divide-y divide-slate-700">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Pop-up: Cadastro/Edição Manual -->
    <div id="modal-manual" class="fixed inset-0 bg-black/80 hidden flex justify-center items-center z-50 backdrop-blur-sm p-2">
        <div class="bg-slate-800 border border-slate-600 p-6 rounded-xl shadow-2xl w-full max-w-md max-h-[95vh] overflow-y-auto">
            
            <div class="flex justify-between items-center mb-6">
                <h2 id="titulo-modal-manual" class="text-2xl font-bold text-slate-100">Novo Registro</h2>
                <button onclick="fecharModalManual()" class="text-slate-400 hover:text-red-400 transition-colors font-bold text-3xl leading-none">&times;</button>
            </div>
            
            <form id="form-manual" class="flex flex-col gap-4 text-left">
                <input type="hidden" id="cad-id">

                <div class="flex gap-4">
                    <div class="w-1/2">
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">DATA DA MENSAGEM</label>
                        <!-- type="text" com inputmode="numeric" para acionar o teclado numérico do celular -->
                        <input type="text" id="cad-data-mensagem" inputmode="numeric" maxlength="10" placeholder="DD/MM/AAAA" class="bg-slate-700 border border-slate-600 text-slate-200 p-2.5 rounded w-full focus:outline-none focus:border-blue-500" required>
                    </div>
                    <div class="w-1/2">
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">FORMATO ENVIO</label>
                        <select id="cad-formato" class="bg-slate-700 border border-slate-600 text-slate-200 p-2.5 rounded w-full focus:outline-none focus:border-blue-500">
                            <option value="Mensagem">Mensagem</option>
                            <option value="PDF">PDF</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">NOME</label>
                    <input type="text" id="cad-nome" placeholder="Nome completo" class="bg-slate-700 border border-slate-600 text-slate-200 p-2.5 rounded w-full focus:outline-none focus:border-blue-500" required>
                </div>
                <div class="flex gap-4">
                    <div class="w-1/2">
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">INÍCIO</label>
                        <input type="text" id="cad-inicio" inputmode="numeric" maxlength="10" placeholder="DD/MM/AAAA" class="bg-slate-700 border border-slate-600 text-slate-200 p-2.5 rounded w-full focus:outline-none focus:border-blue-500">
                    </div>
                    <div class="w-1/2">
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">FIM</label>
                        <input type="text" id="cad-fim" inputmode="numeric" maxlength="10" placeholder="DD/MM/AAAA" class="bg-slate-700 border border-slate-600 text-slate-200 p-2.5 rounded w-full focus:outline-none focus:border-blue-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">EMPRESA</label>
                    <input type="text" id="cad-empresa" placeholder="Nome da Empresa" class="bg-slate-700 border border-slate-600 text-slate-200 p-2.5 rounded w-full focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">LOCAL</label>
                    <input type="text" id="cad-local" placeholder="Local de autorização" class="bg-slate-700 border border-slate-600 text-slate-200 p-2.5 rounded w-full focus:outline-none focus:border-blue-500">
                </div>
                
                <div class="flex justify-end gap-3 mt-4">
                    <button type="button" onclick="fecharModalManual()" class="px-5 py-3 bg-slate-700 border border-slate-600 text-slate-300 rounded hover:bg-slate-600 transition-colors font-medium">Cancelar</button>
                    <button type="submit" class="px-5 py-3 bg-emerald-600 text-white rounded hover:bg-emerald-500 transition-colors font-medium shadow-lg shadow-emerald-900/50">Salvar Registro</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let todosRegistros = [];
        const modalManual = document.getElementById('modal-manual');
        const modalTabela = document.getElementById('modal-tabela');
        const campoPesquisa = document.getElementById('campo-pesquisa');
        const listaSugestoes = document.getElementById('lista-sugestoes');

        // Máscara automática de data (DD/MM/AAAA) ao digitar com o teclado numérico
        function aplicarMascaraData(e) {
            let valor = e.target.value.replace(/\D/g, "");
            if (valor.length > 8) valor = valor.slice(0, 8);
            
            if (valor.length > 4) {
                valor = valor.replace(/^(\d{2})(\d{2})(\d{0,4})/, "$1/$2/$3");
            } else if (valor.length > 2) {
                valor = valor.replace(/^(\d{2})(\d{0,2})/, "$1/$2");
            }
            e.target.value = valor;
        }

        // Ativa a máscara nos três campos de data
        ['cad-data-mensagem', 'cad-inicio', 'cad-fim'].forEach(id => {
            document.getElementById(id).addEventListener('input', aplicarMascaraData);
        });
        
        function abrirModalManual() { 
            document.getElementById('form-manual').reset();
            document.getElementById('cad-id').value = '';
            document.getElementById('titulo-modal-manual').innerText = "Novo Registro";
            modalManual.classList.remove('hidden'); 
        }
        
        function fecharModalManual() { 
            modalManual.classList.add('hidden'); 
            document.getElementById('form-manual').reset(); 
        }
        
        function fecharModalTabela() { 
            modalTabela.classList.add('hidden'); 
            campoPesquisa.value = ''; 
        }

        function removerAcentos(str) {
            return str ? str.normalize("NFD").replace(/[\u0300-\u036f]/g, "") : "";
        }

        function isValido(dataStr, fimStr) {
            const dataBase = fimStr || dataStr;
            if (!dataBase) return false;
            const partes = String(dataBase).replace(/-/g, '/').split('/');
            if (partes.length < 3) return false;
            
            let [dia, mes, ano] = partes;
            if (ano.length === 2) ano = `20${ano}`;
            
            const dataLimite = new Date(`${ano}-${mes}-${dia}T23:59:59`);
            return dataLimite >= new Date();
        }

        function editarRegistro(id) {
            const registro = todosRegistros.find(r => r.id == id);
            if (!registro) return;
            
            document.getElementById('cad-id').value = registro.id;
            document.getElementById('cad-data-mensagem').value = registro.data_mensagem || '';
            document.getElementById('cad-formato').value = registro.formato_envio || 'Mensagem';
            document.getElementById('cad-nome').value = registro.nome || '';
            document.getElementById('cad-inicio').value = registro.inicio_autorizacao || '';
            document.getElementById('cad-fim').value = registro.fim_autorizacao || '';
            document.getElementById('cad-empresa').value = registro.empresa || '';
            document.getElementById('cad-local').value = registro.local_autorizacao || '';
            
            document.getElementById('titulo-modal-manual').innerText = "Editar Registro";
            modalManual.classList.remove('hidden');
        }

        async function excluirRegistro(id, nome) {
            if (!confirm(`Tem certeza que deseja excluir o cadastro de:\n${nome}?`)) return;
            
            try {
                const res = await fetch(`/autorizacoes/${id}`, { method: 'DELETE' });
                const data = await res.json();
                alert(data.mensagem || data.erro);
                await carregarDados();
                atualizarTabelaAberta();
            } catch (err) {
                alert('Erro ao tentar excluir.');
            }
        }

        document.getElementById('planilha').addEventListener('change', async (e) => {
            const arquivo = e.target.files[0];
            if (!arquivo) return;
            const formData = new FormData();
            formData.append('planilha', arquivo);

            try {
                const res = await fetch('/importar', { method: 'POST', body: formData });
                const data = await res.json();
                alert(data.mensagem || data.erro);
                await carregarDados();
                atualizarTabelaAberta();
            } catch (err) {
                alert('Erro ao comunicar com o servidor.');
            }
            e.target.value = '';
        });

        document.getElementById('form-manual').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('cad-id').value;
            const registro = {
                data_mensagem: document.getElementById('cad-data-mensagem').value,
                formato_envio: document.getElementById('cad-formato').value,
                nome: document.getElementById('cad-nome').value,
                inicio_autorizacao: document.getElementById('cad-inicio').value,
                fim_autorizacao: document.getElementById('cad-fim').value,
                empresa: document.getElementById('cad-empresa').value,
                local_autorizacao: document.getElementById('cad-local').value
            };

            const url = id ? `/autorizacoes/${id}` : '/autorizacoes';
            const method = id ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(registro)
                });
                const data = await res.json();
                alert(data.mensagem || data.erro);
                fecharModalManual();
                await carregarDados();
                atualizarTabelaAberta();
            } catch (err) {
                alert('Erro ao salvar.');
            }
        });

        function atualizarTabelaAberta() {
            if (!modalTabela.classList.contains('hidden')) {
                if (campoPesquisa.value.trim() !== '') {
                    pesquisar();
                } else {
                    verTodos();
                }
            }
        }

        campoPesquisa.addEventListener('input', (e) => {
            const termo = removerAcentos(e.target.value.trim().toLowerCase());
            if (!termo) {
                listaSugestoes.classList.add('hidden');
                return;
            }

            const sugestoes = [...new Set(todosRegistros
                .filter(item => (item.nome && removerAcentos(item.nome.toLowerCase()).includes(termo)))
                .map(item => item.nome)
            )].slice(0, 6);

            if (sugestoes.length === 0) {
                listaSugestoes.classList.add('hidden');
                return;
            }

            listaSugestoes.innerHTML = '';
            sugestoes.forEach(nome => {
                const li = document.createElement('li');
                li.className = 'p-3 hover:bg-slate-700 cursor-pointer text-slate-200 border-b border-slate-700 last:border-0 text-sm md:text-base';
                li.innerText = nome;
                li.onmousedown = () => { 
                    campoPesquisa.value = nome;
                    listaSugestoes.classList.add('hidden');
                    pesquisarBtn();
                };
                listaSugestoes.appendChild(li);
            });
            listaSugestoes.classList.remove('hidden');
        });

        campoPesquisa.addEventListener('blur', () => {
            setTimeout(() => listaSugestoes.classList.add('hidden'), 150);
        });

        campoPesquisa.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                listaSugestoes.classList.add('hidden');
                pesquisarBtn();
            }
        });

        function pesquisarBtn() {
            const inputVal = campoPesquisa.value.trim();
            if (!inputVal) {
                alert("Digite algo para pesquisar.");
                return;
            }
            pesquisar();
        }

        function pesquisar() {
            const inputVal = campoPesquisa.value.trim();
            const termo = removerAcentos(inputVal.toLowerCase());
            const filtrados = todosRegistros.filter(item => 
                (item.nome && removerAcentos(item.nome.toLowerCase()).includes(termo)) ||
                (item.empresa && removerAcentos(item.empresa.toLowerCase()).includes(termo))
            );
            
            document.getElementById('titulo-modal-tabela').innerText = `Resultados para: "${inputVal}"`;
            renderizarTabela(filtrados);
            modalTabela.classList.remove('hidden');
        }

        function verTodos() {
            document.getElementById('titulo-modal-tabela').innerText = "Todos os Autorizados";
            renderizarTabela(todosRegistros);
            modalTabela.classList.remove('hidden');
        }

        async function carregarDados() {
            try {
                const res = await fetch('/autorizacoes');
                todosRegistros = await res.json();
            } catch (err) {
                console.error('Erro:', err);
            }
        }

        function renderizarTabela(dados) {
            const tbody = document.getElementById('tabela-corpo');
            tbody.innerHTML = ''; 

            if(dados.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" class="p-6 text-slate-400">Nenhum registro encontrado.</td></tr>`;
                return;
            }

            dados.forEach(item => {
                const tr = document.createElement('tr');
                tr.classList.add('hover:bg-slate-700/50', 'transition-colors');
                
                const statusAtivo = isValido(item.data_mensagem, item.fim_autorizacao);
                
                const badgeStatus = statusAtivo 
                    ? `<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1 rounded-full text-xs font-bold tracking-wide">Válido</span>`
                    : `<span class="bg-red-500/10 text-red-400 border border-red-500/20 px-3 py-1 rounded-full text-xs font-bold tracking-wide">Vencido</span>`;

                tr.innerHTML = `
                    <td class="p-4 align-middle">${badgeStatus}</td>
                    <td class="p-4 text-slate-300">${item.data_mensagem || '-'}</td>
                    <td class="p-4 font-medium text-left text-slate-100">${item.nome}</td>
                    <td class="p-4 text-slate-300">${item.inicio_autorizacao || '-'}</td>
                    <td class="p-4 text-slate-300">${item.fim_autorizacao || '-'}</td>
                    <td class="p-4 text-left text-slate-300">${item.empresa || '-'}</td>
                    <td class="p-4 text-left text-slate-300">${item.local_autorizacao || '-'}</td>
                    <td class="p-4 text-center">
                        <span class="px-2 py-1 bg-slate-700 border border-slate-600 text-xs rounded-full text-slate-300">${item.formato_envio || '-'}</span>
                    </td>
                    <td class="p-4 text-center flex justify-center gap-2 items-center">
                        <button onclick="editarRegistro('${item.id}')" class="bg-blue-600/20 text-blue-400 hover:bg-blue-500 hover:text-white px-2 py-1 rounded transition-colors text-xs font-bold uppercase tracking-wider" title="Editar">Editar</button>
                        <button onclick="excluirRegistro('${item.id}', '${item.nome}')" class="bg-red-600/20 text-red-400 hover:bg-red-500 hover:text-white px-2 py-1 rounded transition-colors text-xs font-bold uppercase tracking-wider" title="Remover">Excluir</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }
        
        carregarDados();
    </script>
</body>
</html>
